<form>
  <div [hidden]="ajout">
    <label>ID Type de cuisine</label>
    <input
      type="text"
      [(ngModel)]="typecuisine.idtype"
      name="idtype"
      class="form-control w-25"
      readonly
    >
  </div>
  <div>
    <label>Nom Type de cuisine</label>
    <input
      type="text"
      [(ngModel)]="typecuisine.nomtype"
      name="nomtype"
      class="form-control"
      placeholder="Entrez un nom de type de cuisine..."
    >
  </div>
  <div class="mt-2">
    <button
      type="submit"
      [disabled]="!typecuisine.nomtype"
      class="btn btn-success"
      (click)="saveTypecuisine()"
    >
      {{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
