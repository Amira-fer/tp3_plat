
<div class="container">
    <div class="card shadow mb-4">
        <div class="card-body">

            <h2 class="mb-3">Liste des plats</h2>

            <div *ngIf="plats.length > 0; else aucunPlat">

                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Id</th>
                            <th>Nom</th>
                            <th>Prix</th>
                            <th>Date Ajout</th>
                            <th>Type de cuisine</th>

                            <th *ngIf="authService.isAdmin()">
                                Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr *ngFor="let plat of plats; let i = index">

                            <td>{{ i + 1 }}</td>
                            <td>{{ plat.idPlat }}</td>
                            <td>{{ plat.nomPlat }}</td>
                            <td>{{ plat.prixPlat }}</td>
                            <td>{{ plat.dateAjout | date:'dd/MM/yyyy' }}</td>
                            <td>{{ plat.typecuisine?.nomtype }}</td>

                            <td *ngIf="authService.isAdmin()">

                                <button
                                    class="btn btn-danger"
                                    (click)="supprimerPlat(plat)">
                                    Supprimer
                                </button>

                                <a
                                    class="btn btn-success ms-2"
                                    [routerLink]="['/updatePlat', plat.idPlat]">
                                    Modifier
                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <ng-template #aucunPlat>
                <h1>Aucun plat trouvé !</h1>
            </ng-template>

        </div>
    </div>
</div>
