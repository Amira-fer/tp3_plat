<div class="container mt-4">

  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-typecuisine
      [typecuisine]="updatedType"
      (typecuisineUpdated)="typecuisineUpdated($event)"
      [ajout]="ajout"
    ></app-update-typecuisine>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Type de cuisine</th>
            <th>Actions</th>
          </tr>
        </thead>
        @for (type of typesCuisine; track type.idtype) {
          <tbody>
            <tr>
              <td>{{ type.idtype }}</td>
              <td>{{ type.nomtype }}</td>
              <td>
                <a class="btn btn-success" (click)="updateType(type)">Editer</a>
              </td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>

</div>
